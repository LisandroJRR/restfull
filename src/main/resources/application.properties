spring.application.name=RestFull
server.port=${PORT:8080}

# Conexión a Aiven MySQL
spring.datasource.url=jdbc:mysql://categoriashexogonaleslayers.d.aivencloud.com:11455/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
# Usamos una variable de entorno para no exponer la contraseña en GitHub
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true